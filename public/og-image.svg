<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B16" />
      <stop offset="60%" stop-color="#2B211B" />
      <stop offset="100%" stop-color="#1B1410" />
    </linearGradient>
    <radialGradient id="og-glow-gold" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#C08A2E" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#C08A2E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="og-glow-clay" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#8A5A36" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8A5A36" stop-opacity="0" />
    </radialGradient>
    <pattern id="og-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F2E9DA" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background base & ambient lights -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-glow-gold)" />
  <rect width="1200" height="630" fill="url(#og-glow-clay)" />
  <rect width="1200" height="630" fill="url(#og-grid)" />

  <!-- Outer frame border -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#F2E9DA" stroke-width="2" stroke-opacity="0.12" />

  <!-- Brand Header: Logo mark + Goma Title -->
  <g transform="translate(80, 84)">
    <rect width="64" height="64" rx="16" fill="#342821" stroke="#F2E9DA" stroke-width="2" stroke-opacity="0.15" />
    <path
      d="M43 23 C40.4 19.2 36.2 17 31.2 17 C22.8 17 17 23.4 17 32 C17 40.6 22.8 47 31.6 47 C39.6 47 45.6 41.6 46 32.8 H32.4"
      fill="none"
      stroke="#F2E9DA"
      stroke-width="4.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="45" cy="19" r="4.4" fill="#C08A2E" />

    <text x="84" y="44" font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="34" fill="#FDFCFB" letter-spacing="-0.03em">Goma</text>
    <text x="186" y="44" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="14" fill="#C08A2E" letter-spacing="0.08em">· BÉNIN MARKETPLACE</text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="210" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#C08A2E" letter-spacing="0.14em">DELANO COLLECTION · ATELIER &amp; FRIPERIE</text>

  <!-- Main Headline -->
  <text x="80" y="280" font-family="'Bricolage Grotesque', sans-serif" font-size="56" font-weight="800" fill="#FDFCFB" letter-spacing="-0.03em">
    La marketplace de référence
  </text>
  <text x="80" y="348" font-family="'Bricolage Grotesque', sans-serif" font-size="56" font-weight="800" fill="#F2E9DA" letter-spacing="-0.03em">
    en vêtements et accessoires.
  </text>

  <!-- Tagline / Subtitle in Source Serif -->
  <text x="80" y="414" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="400" fill="#E7E2D9" fill-opacity="0.88">
    Pièces neuves d’atelier, friperie 1er choix triée et conseil IA en FCFA — Cotonou &amp; Calavi en 48 h.
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(80, 480)">
    <!-- Badge 1: Neuf & Frip -->
    <g transform="translate(0, 0)">
      <rect width="210" height="46" rx="12" fill="#342821" stroke="#E7E2D9" stroke-width="1.5" stroke-opacity="0.2" />
      <circle cx="24" cy="23" r="6" fill="#C08A2E" />
      <text x="38" y="29" font-family="'Bricolage Grotesque', sans-serif" font-size="14" font-weight="700" fill="#FDFCFB">Neuf &amp; Pièces Uniques</text>
    </g>

    <!-- Badge 2: Conseil IA -->
    <g transform="translate(226, 0)">
      <rect width="220" height="46" rx="12" fill="#342821" stroke="#E7E2D9" stroke-width="1.5" stroke-opacity="0.2" />
      <circle cx="24" cy="23" r="6" fill="#8A5A36" />
      <text x="38" y="29" font-family="'Bricolage Grotesque', sans-serif" font-size="14" font-weight="700" fill="#FDFCFB">Conseiller IA Personnel</text>
    </g>

    <!-- Badge 3: Livraison 48h Bénin -->
    <g transform="translate(462, 0)">
      <rect width="240" height="46" rx="12" fill="#342821" stroke="#E7E2D9" stroke-width="1.5" stroke-opacity="0.2" />
      <circle cx="24" cy="23" r="6" fill="#C08A2E" />
      <text x="38" y="29" font-family="'Bricolage Grotesque', sans-serif" font-size="14" font-weight="700" fill="#FDFCFB">Livraison 48h Cotonou</text>
    </g>

    <!-- Badge 4: Paiements -->
    <g transform="translate(718, 0)">
      <rect width="260" height="46" rx="12" fill="#342821" stroke="#E7E2D9" stroke-width="1.5" stroke-opacity="0.2" />
      <circle cx="24" cy="23" r="6" fill="#22C55E" />
      <text x="38" y="29" font-family="'Bricolage Grotesque', sans-serif" font-size="14" font-weight="700" fill="#FDFCFB">MTN · Moov · À la livraison</text>
    </g>
  </g>
</svg>
